services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: shelfwise
      POSTGRES_USER: shelfwise
      POSTGRES_PASSWORD: shelfwise
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shelfwise -d shelfwise"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  backend:
    profiles:
      - app
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - path: backend/.env
        required: false
    environment:
      - RUNNING_IN_DOCKER=1
      - DB_NAME=shelfwise
      - DB_USER=shelfwise
      - DB_PASSWORD=shelfwise
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - DEMO_DATA_PATH=/data/sample_sales.csv
      - FRONTEND_URL=http://localhost:5173
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data:ro
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    profiles:
      - app
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
  media:
